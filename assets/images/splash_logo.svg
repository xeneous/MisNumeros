<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7E57C2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5E35B1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#F3E5F5;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>

  <!-- Financial graph/position icon - represents balance/positioning -->
  <!-- Rising bars representing financial growth -->
  <rect x="140" y="220" width="40" height="120" rx="8" fill="url(#iconGradient)"/>
  <rect x="195" y="180" width="40" height="160" rx="8" fill="url(#iconGradient)"/>
  <rect x="250" y="140" width="40" height="200" rx="8" fill="url(#iconGradient)"/>
  <rect x="305" y="160" width="40" height="180" rx="8" fill="url(#iconGradient)"/>

  <!-- Trend line overlay -->
  <path d="M 140 240 Q 195 200, 250 160 T 345 180"
        stroke="#FFD54F"
        stroke-width="4"
        fill="none"
        stroke-linecap="round"/>

  <!-- Circle accent on trend line -->
  <circle cx="250" cy="160" r="8" fill="#FFD54F"/>
  <circle cx="250" cy="160" r="4" fill="#FFFFFF"/>

  <!-- App initial "P" in elegant font style -->
  <text x="256" y="420"
        font-family="Arial, sans-serif"
        font-size="80"
        font-weight="bold"
        fill="#FFFFFF"
        text-anchor="middle">P</text>
</svg>
